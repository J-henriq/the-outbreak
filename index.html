<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcane Engineers</title>
  <meta name="description" content="Arcane Engineers - A co-op action-strategy RPG where magic and machinery intertwine. Choose from Golemancer, Alchemist, or Artificer and conquer procedurally generated dungeons.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loadingScreen">
    <h1>ARCANE <span>ENGINEERS</span></h1>
    <p>Where Magic and Machinery Intertwine</p>
    <div class="loading-bar-container">
      <div class="loading-bar"></div>
    </div>
  </div>

  <!-- Decorative background particles -->
  <div class="particles" id="particles" aria-hidden="true"></div>

  <!-- Game Container -->
  <div id="gameContainer">

    <!-- Header bar -->
    <div id="header" role="banner">
      <div class="logo">Arcane <span>Engineers</span></div>
      <div class="controls-hint">WASD: Move &nbsp;|&nbsp; Click: Attack &nbsp;|&nbsp; 1-3: Abilities &nbsp;|&nbsp; E: Interact</div>
    </div>

    <!-- Game Canvas -->
    <canvas
      id="gameCanvas"
      role="application"
      aria-label="Arcane Engineers Game"
      tabindex="0"
    ></canvas>

  </div>

  <!-- Controls Reference (bottom-right overlay) -->
  <aside id="controlsOverlay" aria-label="Game Controls Reference">
    <strong>Controls</strong><br>
    WASD / Arrows — Move<br>
    Left Click — Basic Attack<br>
    1 / 2 / 3 — Abilities<br>
    E — Interact<br>
    I — Inventory<br>
    K — Skill Tree<br>
    P / ESC — Pause
  </aside>

  <!-- Game Scripts (order matters) -->
  <script src="js/config.js"></script>
  <script src="js/gear.js"></script>
  <script src="js/player.js"></script>
  <script src="js/dungeon.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>

  <script>
    // Generate background particles
    (function() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = (6 + Math.random() * 12) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
        const colors = ['#4a90d9', '#f5a623', '#9b59b6', '#7ed321'];
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        container.appendChild(p);
      }
    })();

    // Hide loading screen after scripts load
    window.addEventListener('load', function() {
      setTimeout(function() {
        const ls = document.getElementById('loadingScreen');
        ls.classList.add('hidden');
        setTimeout(function() { ls.style.display = 'none'; }, 500);
        // Focus canvas for keyboard input
        document.getElementById('gameCanvas').focus();
      }, 1300);
    });
  </script>

</body>
</html>
